[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "causora"
version = "0.2.0"
description = "Explainable configuration change impact analysis"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.4,<3", "PyYAML>=6,<7", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2,<3", "prometheus-client>=0.20,<1"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6,<7", "Pygments>=2.20,<3", "bandit>=1.7,<2"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI Depends() in function defaults is its dependency injection idiom.
extend-ignore = ["B008"]

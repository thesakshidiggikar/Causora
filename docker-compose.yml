services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      CAUSORA_ENVIRONMENT: development
      CAUSORA_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
